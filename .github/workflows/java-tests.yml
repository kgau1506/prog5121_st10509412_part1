
name: Java Automated Tests

'on':
  push:
    branches:
      - KhanbanTasks
  pull_request:
    branches:
      - KhanbanTasks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit 4 dependencies
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o "$RUNNER_TEMP/junit-4.13.2.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o "$RUNNER_TEMP/hamcrest-core-1.3.jar"

      - name: Build project and run tests
        run: |
          ant -noinput \
            "-Dlibs.junit_4.classpath=$RUNNER_TEMP/junit-4.13.2.jar:$RUNNER_TEMP/hamcrest-core-1.3.jar" \
            clean test
